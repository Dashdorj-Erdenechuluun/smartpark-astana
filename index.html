<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SmartPark Astana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width app column; parking-sign navy + amber; spot grid is the hero of each lot */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#14212b; --muted:#5b6b7b; --line:#d6dde4;
  --navy:#0e2a3d; --amber:#f2b705; --amber-ink:#0e2a3d;
  --free:#1f8a4c; --busy:#c63d3d; --held:#d08a00; --off:#8a96a3;
  --free-bg:#e3f4ea; --busy-bg:#fbe6e6; --held-bg:#fdf1d6; --off-bg:#eceff2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --card:#13212c; --ink:#e7edf2; --muted:#9aabb9; --line:#24384a;
  --navy:#081a26; --amber:#f2b705; --amber-ink:#0e2a3d;
  --free:#4cc27f; --busy:#ec6b6b; --held:#f0b23a; --off:#7d8b98;
  --free-bg:#163626; --busy-bg:#3d1c1c; --held-bg:#3b2d10; --off-bg:#1d2a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --card:#13212c; --ink:#e7edf2; --muted:#9aabb9; --line:#24384a;
  --navy:#081a26; --amber:#f2b705; --amber-ink:#0e2a3d;
  --free:#4cc27f; --busy:#ec6b6b; --held:#f0b23a; --off:#7d8b98;
  --free-bg:#163626; --busy-bg:#3d1c1c; --held-bg:#3b2d10; --off-bg:#1d2a35; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.top{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:560px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
main{max-width:560px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h1{font-size:21px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--amber)}
.steplabel{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
select,input{width:100%;font:inherit;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;font-size:15.5px;background:var(--amber);color:var(--amber-ink);cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.lot{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.lot:hover{border-color:var(--amber)}
.lot .free{min-width:58px;text-align:center;border-radius:9px;padding:6px 4px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.lot .free small{display:block;font-size:10.5px;font-weight:500}
.f-ok{background:var(--free-bg);color:var(--free)} .f-low{background:var(--held-bg);color:var(--held)} .f-none{background:var(--busy-bg);color:var(--busy)}
.lot .info{flex:1;min-width:0}.lot .name{font-weight:600}
.lot .meta{font-size:12.5px;color:var(--muted)}
.price{font-family:var(--mono);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.spot{aspect-ratio:1/1.25;border-radius:7px;border:2px solid transparent;font:inherit;font-size:11px;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.spot b{font-size:13px}
.s-free{background:var(--free-bg);color:var(--free)} .s-occupied{background:var(--busy-bg);color:var(--busy);cursor:not-allowed}
.s-reserved{background:var(--held-bg);color:var(--held);cursor:not-allowed} .s-maintenance{background:var(--off-bg);color:var(--off);cursor:not-allowed}
.spot.sel{border-color:var(--ink)}
.spot.flash{animation:fl 1.2s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.spot.flash{animation:none}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--free)}
.data{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:9px 10px;color:var(--muted)}
.data b{color:var(--ink)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.sum dt{color:var(--muted)} .sum dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.total{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border:1px solid var(--line);border-radius:10px;padding:12px 6px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pay button[aria-pressed="true"]{border:2px solid var(--amber);background:var(--held-bg)}
.ok{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.tick{width:58px;height:58px;border-radius:50%;background:var(--free-bg);color:var(--free);display:grid;place-items:center;font-size:30px;font-weight:700}
.code{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:2px;background:var(--bg);padding:8px 14px;border-radius:9px}
.notif{display:flex;gap:10px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:12px;padding:11px 13px;font-size:13.5px}
.notif .logo{flex:none;width:26px;height:26px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-done{background:var(--free-bg);color:var(--free)} .p-part{background:var(--held-bg);color:var(--held)} .p-plan{background:var(--off-bg);color:var(--off)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;padding:0;align-self:flex-start}
.banner{font-size:12.5px;background:var(--held-bg);color:var(--ink);border-radius:9px;padding:8px 11px}
</style>

<header class="top"><div class="top-in">
  <div class="logo" aria-hidden="true">P</div>
  <div class="brand">SmartPark<small>Astana · prototype</small></div>
  <nav class="tabs" aria-label="Views">
    <button id="tab-driver" aria-pressed="true">Driver</button>
    <button id="tab-operator" aria-pressed="false">Operator</button>
    <button id="tab-about" aria-pressed="false">About</button>
  </nav>
</div></header>

<main id="app"></main>

<script>
// ---------- sample data (same as the Assignment 3 database) ----------
const LOTS=[
 {id:1,name:"Expo Business Center Lot",district:"Yesil",rate:300,hours:"24/7",addr:"Mangilik El Ave 53/1"},
 {id:2,name:"Khan Shatyr Underground",district:"Yesil",rate:400,hours:"08:00–23:00",addr:"Turan Ave 37"},
 {id:3,name:"Baiterek Boulevard Lot",district:"Yesil",rate:350,hours:"07:00–23:00",addr:"Nurzhol Blvd 14"},
 {id:4,name:"Mega Silk Way Parking",district:"Yesil",rate:250,hours:"09:00–00:00",addr:"Kabanbay Batyr Ave 62"},
 {id:5,name:"Railway Station Lot",district:"Saryarka",rate:200,hours:"24/7",addr:"Gabdullin St 1"},
 {id:6,name:"Old Town Square Lot",district:"Almaty",rate:150,hours:"07:00–22:00",addr:"Beibitshilik St 10"},
 {id:7,name:"Keruen Mall Parking",district:"Yesil",rate:300,hours:"10:00–22:00",addr:"Dostyk St 9"},
 {id:9,name:"University Campus Lot",district:"Yesil",rate:100,hours:"07:00–21:00",addr:"Mangilik El Ave 55/11"},
 {id:10,name:"Airport Short-Stay",district:"Nura",rate:500,hours:"24/7",addr:"Nursultan Nazarbayev Airport"},
];
const CARS=[{plate:"654MDN01",label:"Chevrolet Cobalt · 654MDN01",ev:false},{plate:"258ARZ01",label:"Zeekr 001 (EV) · 258ARZ01",ev:true}];
// seeded random so every visitor sees the same starting picture
let seed=2616;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const SPOTS={};
LOTS.forEach(l=>{const arr=[];const rows="ABCD";const occ=[.55,.8,.7,.6,.5,.4,.65,.45,.75][LOTS.indexOf(l)];
  for(let i=0;i<24;i++){const r=rnd();const type=i<4?"ev":(i===4||i===5)?"disabled":"standard";
    let st=r<occ?"occupied":r<occ+.06?"reserved":"free"; if(i===17&&l.id===5)st="maintenance";
    arr.push({code:rows[Math.floor(i/6)]+"-"+String(i%6+1).padStart(2,"0"),type,status:st});}
  SPOTS[l.id]=arr;});
const HOUR_OCC=[9.0,7.7,8.9,9.2,8.3,8.0,7.7,8.9,22.3,32.0,31.8,35.9,48.9,52.3,60.9,61.5,67.1,63.6,58.4,42.3,25.5,20.0,12.9,9.2];
const SENSORS=[
 {serial:"SP-UL-0009",lot:"Railway Station Lot",spot:"S-07",battery:8,ping:"2 days ago"},
 {serial:"SP-UL-0006",lot:"Baiterek Boulevard Lot",spot:"C-05",battery:12,ping:"2 h ago"},
 {serial:"SP-UL-0003",lot:"Expo Business Center Lot",spot:"A-03",battery:17,ping:"just now"}];
const REVENUE=[["Mega Silk Way Parking",1750],["Expo Business Center Lot",1350],["Khan Shatyr Underground",800],["Baiterek Boulevard Lot",700],["University Campus Lot",600]];

// ---------- state ----------
const S={view:"driver",step:1,district:"Yesil",type:"any",lot:null,spot:null,car:0,start:"10:00",hours:2,pay:null,code:null};
const $=s=>document.querySelector(s);
const freeCount=(id,type)=>SPOTS[id].filter(s=>s.status==="free"&&(type==="any"||s.type===type)).length;
const kzt=n=>n.toLocaleString("en-US").replace(/,/g," ")+" ₸";
const STEP_NAMES=["Search","Choose parking","Choose spot","Time & car","Pay","Done"];

function stepBar(){return `<div><div class="steps">${STEP_NAMES.map((_,i)=>`<span class="${i<S.step?"on":""}"></span>`).join("")}</div>
<div class="steplabel">Step ${S.step} of 6 · ${STEP_NAMES[S.step-1]}</div></div>`}
function dataNote(t){return `<div class="data">Data layer: ${t}</div>`}

// ---------- driver screens ----------
function driver(){
  const m=$("#app");
  if(S.step===1){
    const districts=[...new Set(LOTS.map(l=>l.district))];
    m.innerHTML=`${stepBar()}
    <div class="card"><h1>Find a free parking spot</h1><p class="muted small" style="margin:6px 0 14px">Spots are shown free or busy by a sensor in each bay.</p>
      <label for="district">District</label>
      <select id="district">${districts.map(d=>`<option ${d===S.district?"selected":""}>${d}</option>`).join("")}</select>
      <div style="margin-top:12px"><label>Spot type</label><div class="chips" id="types">
      ${[["any","Any"],["ev","EV charging"],["disabled","Disabled"]].map(([v,t])=>`<button class="chip" data-v="${v}" aria-pressed="${S.type===v}">${t}</button>`).join("")}</div></div>
      <div style="margin-top:16px"><button class="btn" id="go">Show parking</button></div></div>
    ${dataNote("reads <b>parking_lots</b> and <b>parking_spots</b> (Assignment 3 database)")}`;
    $("#district").onchange=e=>S.district=e.target.value;
    document.querySelectorAll("#types .chip").forEach(b=>b.onclick=()=>{S.type=b.dataset.v;render()});
    $("#go").onclick=()=>{S.step=2;render()};
  }
  else if(S.step===2){
    const list=LOTS.filter(l=>l.district===S.district).map(l=>({...l,free:freeCount(l.id,S.type)})).sort((a,b)=>b.free-a.free||a.rate-b.rate);
    m.innerHTML=`${stepBar()}<button class="back" id="back">← Change search</button>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h1>${S.district} · ${S.type==="any"?"all spots":S.type==="ev"?"EV charging":"disabled spots"}</h1><span class="live">Live (simulated sensors)</span></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="lots">
    ${list.map(l=>{const c=l.free===0?"f-none":l.free<3?"f-low":"f-ok";return `<button class="lot" data-id="${l.id}" ${l.free===0?"disabled":""}>
      <div class="free ${c}">${l.free}<small>free</small></div>
      <div class="info"><div class="name">${l.name}</div><div class="meta">${l.addr} · ${l.hours}</div></div>
      <div class="price">${l.rate} ₸/h</div></button>`}).join("")}</div>
    ${dataNote("free count = spots with <b>status = 'free'</b>, updated by <b>sensors</b> → <b>sensor_readings</b>")}`;
    $("#back").onclick=()=>{S.step=1;render()};
    document.querySelectorAll(".lot").forEach(b=>b.onclick=()=>{S.lot=+b.dataset.id;S.spot=null;S.step=3;render()});
  }
  else if(S.step===3){
    const l=LOTS.find(x=>x.id===S.lot);
    m.innerHTML=`${stepBar()}<button class="back" id="back">← Back to parking list</button>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>${l.name}</h2><span class="live">Live</span></div>
    <p class="muted small" style="margin:0 0 10px">Tap a green spot. ⚡ = EV charger, ♿ = disabled.</p>
    <div class="grid" id="grid">${SPOTS[l.id].map((s,i)=>{const okType=S.type==="any"||s.type===S.type;
      return `<button class="spot s-${s.status} ${S.spot===i?"sel":""}" data-i="${i}" ${s.status!=="free"||!okType?"disabled":""} aria-label="Spot ${s.code}, ${s.status}${s.type!=="standard"?", "+s.type:""}" style="${okType?"":"opacity:.35"}">
      <b>${s.code}</b>${s.type==="ev"?"⚡":s.type==="disabled"?"♿":""}</button>`}).join("")}</div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--free)"></i>free</span><span><i style="background:var(--busy)"></i>occupied</span><span><i style="background:var(--held)"></i>reserved</span><span><i style="background:var(--off)"></i>maintenance</span></div></div>
    <button class="btn" id="next" ${S.spot===null?"disabled":""}>${S.spot===null?"Choose a spot":"Continue with "+SPOTS[l.id][S.spot].code}</button>
    ${dataNote("spot colour = <b>parking_spots.status</b>; sensor events are simulated every few seconds")}`;
    $("#back").onclick=()=>{S.step=2;render()};
    document.querySelectorAll("#grid .spot").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.spot=+b.dataset.i;render()});
    $("#next").onclick=()=>{if(S.spot!==null){S.step=4;render()}};
  }
  else if(S.step===4){
    const l=LOTS.find(x=>x.id===S.lot),sp=SPOTS[l.id][S.spot];
    const evOnly=sp.type==="ev";
    m.innerHTML=`${stepBar()}<button class="back" id="back">← Choose another spot</button>
    <div class="card"><h2>${l.name} · ${sp.code}</h2>
      <div class="row" style="margin-top:8px"><div><label for="start">Start (tomorrow)</label><select id="start">${["08:00","09:00","10:00","11:00","12:00","14:00","16:00","18:00"].map(t=>`<option ${t===S.start?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label for="hours">Hours</label><select id="hours">${[1,2,3,4,5,6].map(h=>`<option value="${h}" ${h===S.hours?"selected":""}>${h} h</option>`).join("")}</select></div></div>
      <div style="margin-top:10px"><label for="car">Car</label><select id="car">${CARS.map((c,i)=>`<option value="${i}" ${i===S.car?"selected":""}>${c.label}</option>`).join("")}</select></div>
      ${evOnly&&!CARS[S.car].ev?`<p class="banner" style="margin:10px 0 0">This is an EV charging spot. Please choose your electric car.</p>`:""}
      <dl class="sum" style="margin:14px 0 0"><dt>Price</dt><dd>${l.rate} ₸ × ${S.hours} h</dd><dt>Total</dt><dd class="total">${kzt(l.rate*S.hours)}</dd></dl></div>
    <button class="btn" id="next" ${evOnly&&!CARS[S.car].ev?"disabled":""}>Go to payment</button>
    ${dataNote("price = <b>parking_lots.hourly_rate_kzt</b> × hours; car from <b>vehicles</b>")}`;
    $("#back").onclick=()=>{S.step=3;render()};
    $("#start").onchange=e=>{S.start=e.target.value;render()};
    $("#hours").onchange=e=>{S.hours=+e.target.value;render()};
    $("#car").onchange=e=>{S.car=+e.target.value;render()};
    $("#next").onclick=()=>{S.step=5;render()};
  }
  else if(S.step===5){
    const l=LOTS.find(x=>x.id===S.lot);
    m.innerHTML=`${stepBar()}<button class="back" id="back">← Back</button>
    <div class="card"><h2>Pay ${kzt(l.rate*S.hours)}</h2><p class="muted small" style="margin:0 0 10px">Demo payment: no real money is taken.</p>
    <div class="pay">${[["kaspi","Kaspi"],["halyk","Halyk"],["card","Card"]].map(([v,t])=>`<button data-v="${v}" aria-pressed="${S.pay===v}">${t}</button>`).join("")}</div></div>
    <button class="btn" id="paybtn" ${S.pay?"":"disabled"}>${S.pay?"Confirm and pay":"Choose a payment method"}</button>
    ${dataNote("one transaction: INSERT <b>reservations</b> + INSERT <b>payments</b> + UPDATE <b>parking_spots</b> SET status='reserved'")}`;
    $("#back").onclick=()=>{S.step=4;render()};
    document.querySelectorAll(".pay button").forEach(b=>b.onclick=()=>{S.pay=b.dataset.v;render()});
    $("#paybtn").onclick=()=>{if(!S.pay)return;SPOTS[S.lot][S.spot].status="reserved";S.code="SP-"+String(Math.floor(1000+rnd()*9000));S.step=6;render()};
  }
  else{
    const l=LOTS.find(x=>x.id===S.lot),sp=SPOTS[l.id][S.spot];
    const [h,mm]=S.start.split(":").map(Number);const end=String(h+S.hours).padStart(2,"0")+":"+String(mm).padStart(2,"0");
    m.innerHTML=`${stepBar()}
    <div class="card ok"><div class="tick">✓</div><h1>Spot booked</h1>
    <div class="code">${S.code}</div><p class="muted small" style="margin:0">Show this code at the entrance</p>
    <dl class="sum" style="width:100%;margin-top:6px"><dt>Parking</dt><dd>${l.name}</dd><dt>Spot</dt><dd>${sp.code}</dd><dt>Time</dt><dd>Tomorrow ${S.start}–${end}</dd><dt>Car</dt><dd>${CARS[S.car].plate}</dd><dt>Paid</dt><dd>${kzt(l.rate*S.hours)} · ${S.pay}</dd></dl></div>
    <div class="notif"><div class="logo">P</div><div><b>Reminder (planned push notification)</b><br>Your parking at ${l.name} starts in 30 minutes. Spot ${sp.code}.</div></div>
    <button class="btn ghost" id="again">Make another booking</button>
    ${dataNote("saved: <b>reservations</b> (status 'booked'), <b>payments</b>, spot status → 'reserved'; reminder → <b>notifications</b> (new table)")}`;
    $("#again").onclick=()=>{Object.assign(S,{step:1,lot:null,spot:null,pay:null,code:null});render()};
  }
}

// ---------- operator dashboard ----------
function chart(){
  const W=520,H=170,p={l:30,r:8,t:10,b:22},bw=(W-p.l-p.r)/24;
  const y=v=>p.t+(H-p.t-p.b)*(1-v/100);
  let g=[0,25,50,75,100].map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l-4}" y="${y(v)+3}" text-anchor="end">${v}%</text>`).join("");
  const peak=HOUR_OCC.indexOf(Math.max(...HOUR_OCC));
  g+=HOUR_OCC.map((v,i)=>`<rect x="${p.l+i*bw+1.5}" y="${y(v)}" width="${bw-3}" height="${y(0)-y(v)}" rx="2" fill="${i===peak?"var(--amber)":"var(--navy)"}" opacity="${i===peak?1:.75}"><title>${i}:00 – ${v}%</title></rect>`).join("");
  g+=[0,6,12,18,23].map(i=>`<text x="${p.l+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${String(i).padStart(2,"0")}h</text>`).join("");
  g+=`<text x="${p.l+peak*bw+bw/2}" y="${y(HOUR_OCC[peak])-4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${HOUR_OCC[peak]}%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average occupancy by hour, peak at ${peak}:00">${g}</svg>`;
}
function operator(){
  const total=Object.values(SPOTS).flat(),free=total.filter(s=>s.status==="free").length,occ=total.filter(s=>s.status==="occupied").length;
  $("#app").innerHTML=`<h1>Operator dashboard</h1>
  <div class="kpis"><div class="kpi"><b>${free}</b><span>free spots now</span></div><div class="kpi"><b>${Math.round(100*occ/total.length)}%</b><span>occupied now</span></div><div class="kpi"><b>3</b><span>sensors need service</span></div></div>
  <div class="card"><h2>Average occupancy by hour</h2><p class="muted small" style="margin:0 0 6px">4 lots, 7 days of sensor readings (simulated demo data, 672 rows)</p>${chart()}
  <p class="small" style="margin:6px 0 0">Busiest at <b>16:00</b> (67%). Quietest at night (under 10%).</p></div>
  <div class="card"><h2>Sensors that need service</h2><div class="tw"><table><tr><th>Sensor</th><th>Parking</th><th>Spot</th><th>Battery</th><th>Last signal</th></tr>
  ${SENSORS.map(s=>`<tr><td style="font-family:var(--mono)">${s.serial}</td><td>${s.lot}</td><td>${s.spot}</td><td><span class="pill ${s.battery<10?"f-none":"f-low"}">${s.battery}%</span></td><td>${s.ping}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Revenue by parking (paid bookings)</h2><div class="tw"><table><tr><th>Parking</th><th style="text-align:right">Revenue</th></tr>
  ${REVENUE.map(r=>`<tr><td>${r[0]}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${kzt(r[1])}</td></tr>`).join("")}</table></div></div>
  ${dataNote("from queries 4 and 5 (Assignment 3) and the new <b>sensor_readings</b> table")}`;
}

// ---------- about / honesty table ----------
function about(){
  const F=[["Search parking by district and spot type","done"],["Free-spot count per parking","done"],["Spot map with live colours","part","sensor updates are simulated in the browser"],["Book a spot for a time and car","done"],["Price calculation","done"],["Payment with Kaspi / Halyk / card","part","demo only, no real payment"],["Booking code confirmation","done"],["Operator dashboard (occupancy, sensors, revenue)","done","uses sample data"],["Real IoT sensors in parking bays","plan"],["Real PostgreSQL server behind the app","plan","database is built and tested in pgAdmin, app uses a copy of the sample data"],["Push notification reminder","plan","shown as a preview"],["Report a problem (support ticket)","plan","table is ready in the database"],["Sign in / user accounts","plan"]];
  const P={done:["p-done","Done"],part:["p-part","Partly"],plan:["p-plan","Planned"]};
  $("#app").innerHTML=`<h1>About this prototype</h1>
  <div class="card"><p style="margin:0">SmartPark Astana helps drivers in Astana find and book a free parking spot. A sensor in each bay reports if it is free. This page is a clickable prototype made for the ICT course (Astana IT University, 2026).</p>
  <p class="small muted" style="margin:8px 0 0">Main scenario: search → choose parking → choose spot → time and car → pay → booking code (6 steps).</p></div>
  <div class="card"><h2>Functions and status</h2><div class="tw"><table><tr><th>Function</th><th>Status</th><th>Note</th></tr>
  ${F.map(f=>`<tr><td>${f[0]}</td><td><span class="pill ${P[f[1]][0]}">${P[f[1]][1]}</span></td><td class="small muted">${f[2]||""}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Where the data is stored</h2><p class="small" style="margin:0 0 8px">PostgreSQL database from Assignment 3 (7 tables) plus 3 new tables from Assignment 4:</p>
  <div class="tw"><table><tr><th>Table</th><th>Used for</th></tr>
  ${[["users, vehicles","driver and car"],["parking_lots, parking_spots","parkings, spots and their status"],["sensors","one IoT sensor per spot"],["reservations, payments","bookings and payments"],["sensor_readings (new)","every free/occupied change with time"],["notifications (new)","booking reminders"],["support_tickets (new)","problems reported by drivers"]].map(r=>`<tr><td style="font-family:var(--mono);font-size:12px">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div></div>
  <p class="small muted">All people, cars and bookings are made-up sample data. No personal data is collected.</p>`;
}

function render(){
  ["driver","operator","about"].forEach(v=>$("#tab-"+v).setAttribute("aria-pressed",S.view===v));
  ({driver,operator,about})[S.view]();
}
["driver","operator","about"].forEach(v=>$("#tab-"+v).onclick=()=>{S.view=v;render();window.scrollTo(0,0)});

// simulated sensor feed: every 4 s one random spot changes (never the chosen one)
setInterval(()=>{
  const lot=LOTS[Math.floor(Math.random()*LOTS.length)].id,arr=SPOTS[lot],i=Math.floor(Math.random()*arr.length),s=arr[i];
  if(s.status==="maintenance"||s.status==="reserved"||(lot===S.lot&&i===S.spot))return;
  s.status=s.status==="free"?"occupied":"free";
  if(S.view==="driver"&&(S.step===2||(S.step===3&&lot===S.lot))){render();if(S.step===3){const el=document.querySelector(`#grid [data-i="${i}"]`);el&&el.classList.add("flash")}}
},4000);
render();
</script>
